# Dependabot version updates. Everything runs once a month to keep the noise low.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Not covered on purpose: the Hugo version. It is pinned by hand in .github/workflows/ci.yaml,
# .github/workflows/deploy.yaml and .devcontainer/devcontainer.json (Dependabot cannot bump those values).

version: 2
updates:
  # Features in .devcontainer/devcontainer.json
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  # Actions used in .github/workflows (checkout, lychee, pages...), all grouped into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # The hugo-coder theme (git submodule). Dependabot moves it to the latest commit of its branch.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
